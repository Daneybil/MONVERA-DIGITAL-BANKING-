<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="mvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B132B" />
      <stop offset="50%" stopColor="#0F172A" />
      <stop offset="100%" stopColor="#064E3B" />
    </linearGradient>
    <linearGradient id="mvBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#334155" />
      <stop offset="100%" stopColor="#10B981" />
    </linearGradient>
    <linearGradient id="mvEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#34D399" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>
    <filter id="mvGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#10B981" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Monvera Rounded Dark Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#mvBg)" stroke="url(#mvBorder)" stroke-width="2" />

  <!-- Inner subtle border -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="#10B981" stroke-width="0.75" stroke-opacity="0.3" />

  <!-- Monvera 'M' Precision Outer Vault Line (Scaled from 32x32: 2x scale) -->
  <path
    d="M12 48V16L32 36L52 16V48"
    stroke="#FFFFFF"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Monvera 'V' Precision Inner Diamond Vault Line -->
  <path
    d="M20 48L32 32L44 48"
    stroke="url(#mvEmerald)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#mvGlow)"
  />

  <!-- Monvera Gem Node (Centered at top of V) -->
  <circle cx="32" cy="20" r="3.5" fill="#34D399" filter="url(#mvGlow)" />
</svg>
